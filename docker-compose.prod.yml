services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod

    container_name: server

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
      "